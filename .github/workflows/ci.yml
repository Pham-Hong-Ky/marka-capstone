name: CI — Marka Capstone

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Tự động hủy các lần chạy trước nếu có commit mới được push lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # JOB 1: Frontend — Lint + TypeScript + Vite Build
  # ──────────────────────────────────────────────────────
  frontend-ci:
    name: "Frontend — Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend (oxlint)
        run: npm run lint

      - name: TypeScript + Vite Build
        run: npm run build

  # ──────────────────────────────────────────────────────
  # JOB 2: Backend — Lint + Prisma + Automated Tests
  # ──────────────────────────────────────────────────────
  backend-ci:
    name: "Backend — Lint, Schema & Automated Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # GitHub tự khởi tạo container PostgreSQL 16 và Redis 7
    # tạm thời cho lần chạy này, tự xóa khi job kết thúc
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Biến môi trường test — dùng giá trị cố định vì đây là môi trường CI
    # (KHÔNG phải credentials production — không cần đặt trong GitHub Secrets)
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/marka_test?schema=public&connection_limit=10&pool_timeout=10
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      PORT: 5000
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_minimum_32_characters
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_minimum_32_characters
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AES_SECRET_KEY: ci_test_aes_secret_key_32_bytes!!
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Backend (oxlint)
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Push Schema to Test DB
        run: npx prisma db push --skip-generate

      - name: Test Connections (PostgreSQL + Redis)
        run: npm run test:connection

      - name: Run Automated Tests (Vitest + Supertest)
        run: npm test
